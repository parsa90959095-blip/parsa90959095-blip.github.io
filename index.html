<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ماشین حساب</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eeeeee;
    font-family: Arial, Tahoma, sans-serif;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    font-size: 30px;
}

h2 {
    text-align: center;
    font-size: 22px;
}

.display {
    background: #111111;
    color: white;
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 20px;
    direction: ltr;
    text-align: left;
    min-height: 100px;
}

#expression {
    color: #aaaaaa;
    font-size: 20px;
    min-height: 30px;
}

#result {
    font-size: 35px;
    font-weight: bold;
    margin-top: 10px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

button {
    min-height: 60px;
    border: none;
    border-radius: 12px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

.number {
    background: #eeeeee;
}

.operator {
    background: #cfe2ff;
}

.special {
    background: #dddddd;
}

.equal {
    background: #222222;
    color: white;
}

.clear {
    background: #ffcccc;
}

.box {
    margin-top: 25px;
    padding: 15px;
    border: 2px solid #dddddd;
    border-radius: 15px;
}

label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    font-size: 20px;
    border: 2px solid #cccccc;
    border-radius: 10px;
    direction: ltr;
}

.action {
    width: 100%;
    margin-top: 15px;
    background: #222222;
    color: white;
}

.answer {
    margin-top: 12px;
    padding: 12px;
    background: #f1f1f1;
    border-radius: 10px;
    text-align: center;
    font-size: 21px;
    font-weight: bold;
    direction: ltr;
}

.history-item {
    background: #f1f1f1;
    margin-top: 7px;
    padding: 10px;
    border-radius: 8px;
    direction: ltr;
    text-align: left;
}

.clear-history {
    width: 100%;
    margin-top: 10px;
    background: #dddddd;
}

</style>
</head>


<body>

<div class="container">

<h1>ماشین حساب</h1>


<!-- نمایشگر -->

<div class="display">

<div id="expression"></div>

<div id="result">0</div>

</div>


<!-- چهار عمل اصلی -->

<div class="box">

<h2>چهار عمل اصلی و قدر مطلق</h2>

<div class="buttons">

<button class="clear" onclick="clearCalculator()">
پاک کردن
</button>

<button class="special" onclick="deleteLast()">
حذف
</button>

<button class="special" onclick="absoluteNumber()">
قدر مطلق
</button>

<button class="operator" onclick="add('/')">
÷
</button>


<button class="number" onclick="add('7')">
۷
</button>

<button class="number" onclick="add('8')">
۸
</button>

<button class="number" onclick="add('9')">
۹
</button>

<button class="operator" onclick="add('*')">
×
</button>


<button class="number" onclick="add('4')">
۴
</button>

<button class="number" onclick="add('5')">
۵
</button>

<button class="number" onclick="add('6')">
۶
</button>

<button class="operator" onclick="add('-')">
−
</button>


<button class="number" onclick="add('1')">
۱
</button>

<button class="number" onclick="add('2')">
۲
</button>

<button class="number" onclick="add('3')">
۳
</button>

<button class="operator" onclick="add('+')">
+
</button>


<button class="number" onclick="add('0')">
۰
</button>

<button class="number" onclick="add('.')">
.
</button>

<button class="special" onclick="add('(')">
(
</button>

<button class="special" onclick="add(')')">
)
</button>


<button
class="equal"
style="grid-column: span 4;"
onclick="calculate()">

محاسبه

</button>

</div>

</div>


<!-- توان -->

<div class="box">

<h2>توان</h2>

<label>
عدد پایه
</label>

<input
id="base"
type="number"
step="any"
placeholder="مثلاً 5">


<label>
توان
</label>

<input
id="power"
type="number"
step="any"
placeholder="مثلاً 3">


<button
class="action"
onclick="powerCalculate()">

محاسبه توان

</button>


<div
id="powerResult"
class="answer">

نتیجه اینجا نمایش داده می‌شود

</div>

</div>


<!-- ب.م.م -->

<div class="box">

<h2>
بزرگ‌ترین مقسوم‌علیه مشترک (ب.م.م)
</h2>

<label>
عدد اول
</label>

<input
id="gcdA"
type="number"
placeholder="مثلاً 24">


<label>
عدد دوم
</label>

<input
id="gcdB"
type="number"
placeholder="مثلاً 36">


<button
class="action"
onclick="gcdCalculate()">

محاسبه ب.م.م

</button>


<div
id="gcdResult"
class="answer">

نتیجه اینجا نمایش داده می‌شود

</div>

</div>


<!-- ک.م.م -->

<div class="box">

<h2>
کوچک‌ترین مضرب مشترک (ک.م.م)
</h2>

<label>
عدد اول
</label>

<input
id="lcmA"
type="number"
placeholder="مثلاً 12">


<label>
عدد دوم
</label>

<input
id="lcmB"
type="number"
placeholder="مثلاً 18">


<button
class="action"
onclick="lcmCalculate()">

محاسبه ک.م.م

</button>


<div
id="lcmResult"
class="answer">

نتیجه اینجا نمایش داده می‌شود

</div>

</div>


<!-- تاریخچه -->

<div class="box">

<h2>
تاریخچه محاسبات
</h2>

<div id="history">

هنوز محاسبه‌ای انجام نشده است.

</div>

<button
class="clear-history"
onclick="clearHistory()">

پاک کردن تاریخچه

</button>

</div>

</div>


<script>

/* =========================
   متغیر اصلی ماشین حساب
========================= */

var expression = "";


/* =========================
   نمایش عبارت
========================= */

function updateDisplay() {

    document.getElementById("expression").innerText = expression;

}


/* =========================
   اضافه کردن عدد یا عملگر
========================= */

function add(value) {

    expression = expression + value;

    updateDisplay();

}


/* =========================
   پاک کردن
========================= */

function clearCalculator() {

    expression = "";

    document.getElementById("expression").innerText = "";

    document.getElementById("result").innerText = "0";

}


/* =========================
   حذف آخرین کاراکتر
========================= */

function deleteLast() {

    expression = expression.slice(0, -1);

    updateDisplay();

}


/* =========================
   محاسبه چهار عمل اصلی
========================= */

function calculate() {

    if (expression === "") {
        return;
    }

    try {

        var answer = Function(
            "return " + expression
        )();

        if (!isFinite(answer)) {

            document.getElementById("result").innerText =
                "خطا";

            return;

        }

        document.getElementById("result").innerText =
            answer;

        addHistory(
            expression + " = " + answer
        );

    }

    catch (error) {

        document.getElementById("result").innerText =
            "خطا";

    }

}


/* =========================
   قدر مطلق
========================= */

function absoluteNumber() {

    if (expression === "") {
        return;
    }

    try {

        var number = Function(
            "return " + expression
        )();

        var answer = Math.abs(number);

        document.getElementById("result").innerText =
            answer;

        addHistory(
            "|" + expression + "| = " + answer
        );

    }

    catch (error) {

        document.getElementById("result").innerText =
            "خطا";

    }

}


/* =========================
   توان
========================= */

function powerCalculate() {

    var base =
        document.getElementById("base").value;

    var power =
        document.getElementById("power").value;


    if (base === "" || power === "") {

        document.getElementById("powerResult").innerText =
            "لطفاً هر دو عدد را وارد کنید.";

        return;

    }


    var answer =
        Math.pow(
            Number(base),
            Number(power)
        );


    document.getElementById("powerResult").innerText =
        base + " ^ " + power + " = " + answer;


    addHistory(
        base + " ^ " + power + " = " + answer
    );

}


/* =========================
   ب.م.م
========================= */

function gcdCalculate() {

    var a =
        Math.abs(
            Math.trunc(
                Number(
                    document.getElementById("gcdA").value
                )
            )
        );


    var b =
        Math.abs(
            Math.trunc(
                Number(
                    document.getElementById("gcdB").value
                )
            )
        );


    if (
        document.getElementById("gcdA").value === "" ||
        document.getElementById("gcdB").value === ""
    ) {

        document.getElementById("gcdResult").innerText =
            "لطفاً هر دو عدد را وارد کنید.";

        return;

    }


    if (a === 0 && b === 0) {

        document.getElementById("gcdResult").innerText =
            "تعریف نشده";

        return;

    }


    while (b !== 0) {

        var temp = b;

        b = a % b;

        a = temp;

    }


    document.getElementById("gcdResult").innerText =
        "ب.م.م = " + a;


    addHistory(
        "ب.م.م = " + a
    );

}


/* =========================
   ک.م.م
========================= */

function lcmCalculate() {

    var a =
        Math.abs(
            Math.trunc(
                Number(
                    document.getElementById("lcmA").value
                )
            )
        );


    var b =
        Math.abs(
            Math.trunc(
                Number(
                    document.getElementById("lcmB").value
                )
            )
        );


    if (
        document.getElementById("lcmA").value === "" ||
        document.getElementById("lcmB").value === ""
    ) {

        document.getElementById("lcmResult").innerText =
            "لطفاً هر دو عدد را وارد کنید.";

        return;

    }


    if (a === 0 || b === 0) {

        document.getElementById("lcmResult").innerText =
            "ک.م.م = 0";

        return;

    }


    var x = a;

    var y = b;


    while (y !== 0) {

        var temp = y;

        y = x % y;

        x = temp;

    }


    var gcd = x;


    var lcm =
        Math.abs(a * b) / gcd;


    document.getElementById("lcmResult").innerText =
        "ک.م.م = " + lcm;


    addHistory(
        "ک.م.م = " + lcm
    );

}


/* =========================
   تاریخچه
========================= */

function addHistory(text) {

    var history =
        document.getElementById("history");


    if (
        history.innerText.trim() ===
        "هنوز محاسبه‌ای انجام نشده است."
    ) {

        history.innerHTML = "";

    }


    var item =
        document.createElement("div");


    item.className =
        "history-item";


    item.innerText =
        text;


    history.insertBefore(
        item,
        history.firstChild
    );

}


/* =========================
   پاک کردن تاریخچه
========================= */

function clearHistory() {

    document.getElementById("history").innerText =
        "هنوز محاسبه‌ای انجام نشده است.";

}

</script>

</body>

</html>
